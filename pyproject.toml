[project]
name = "fubio"
version = "0.1.0"
description = "FU_Biometry (MWM2026) — unified ultrasound biometry landmark model"
requires-python = ">=3.12"
# MIT rather than Apache-2.0: Apache-2.0 §3 grants recipients an irrevocable
# patent licence over the contribution; MIT carries no express patent grant.
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # --- Core DL ---
    "torch>=2.5",
    "torchvision>=0.20",
    "timm>=1.0.15",          # DINOv2 / ConvNeXt V2 backbones
    # --- Medical (support role: Bundle packaging + optional metrics) ---
    "monai>=1.4",
    # --- Augmentation ---
    "albumentations>=2.0",   # keypoint-aware geometric aug (dataloading stage)
    "kornia>=0.7",           # differentiable on-GPU transforms (EC consistency loss)
    "opencv-python-headless>=4.10",
    # --- Data ---
    "numpy>=2.1",
    "polars>=1.0",           # primary dataframe (schema-strict; catches CSV quirks)
    "pyarrow>=17.0",         # parquet manifest + polars<->pandas bridge
    "scipy>=1.14",           # Hungarian matching (train/matcher.py) — reaches serving via FUBioModule
    # --- Config ---
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",           # config loading in train/train.py
    # --- Metrics / serialization ---
    "torchmetrics>=1.5",
    "safetensors>=0.4",
    # --- Tracking / CLI / notebook ---
    "wandb>=0.18",
    "typer>=0.12",
    "marimo>=0.9",
    "plotly>=6.0",
    "tqdm>=4.66",            # inference + submission progress
    # --- Training ---
    "lightning>=2.4",
    "torchinfo>=1.8.0",
    "matplotlib>=3.11.1",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "hypothesis>=6.100",     # property-based tests (equivariance of EC transforms)
    "pyright>=1.1.380",
    "pre-commit>=4.0",
    "streamlit>=1.59",       # viewer
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fubio"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# vendor_dinov2 is third-party vendored code; docker/fubio is assembled from
# src/fubio by docker/build_and_test.sh. Neither is ours to lint.
extend-exclude = ["docker/vendor_dinov2", "docker/fubio"]

[tool.ruff.lint.per-file-ignores]
# add_safe_globals must run before the Lightning imports that trigger torch.load
"src/fubio/train/train.py" = ["E402"]
# The organizers' entry script, kept byte-identical to the submitted container.
"docker/predict.py" = ["E402"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "UP",            # pyupgrade (modern syntax)
    "B",             # bugbear
    "SIM",           # simplify
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
